name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR heads may cancel; every default-branch run keeps its own slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build:verify

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Maintained fork, not rhysd/actionlint: upstream is inactive and its
      # latest release rejects `concurrency.queue`, which the synced gatekeeper
      # caller uses (rhysd/actionlint#661 was closed unmerged). See
      # seankoji-com/.github#200.
      # When updating, change the version and SHA-256 together after checking
      # the linux_amd64 asset digest on the fork's GitHub release.
      - name: Download and verify actionlint
        run: |
          set -euo pipefail
          version=1.16.1
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/kjanat/actionlint/releases/download/v${version}/${archive}"
          echo "d566eee8af147ee1fa24ee204e1a171fcf8b5ce40e267c39a7383c7f20e6236d  $archive" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color
