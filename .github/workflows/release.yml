name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release type"
        required: true
        type: choice
        default: "bugfix"
        options:
          - breaking
          - minor
          - bugfix

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # Skip the redundant tag-push run when the tag was just pushed by the
    # dispatch path below (that push is attributed to seankoji-com-ci[bot]).
    if: github.event_name == 'workflow_dispatch' || github.actor != 'seankoji-com-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install the tested npm publishing version
        run: npm install -g npm@11.5.1

      - name: Prepare the version locally
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run the dispatch against the main branch." >&2
            exit 1
          fi
          case "$BUMP" in
            breaking) LEVEL="major" ;;
            minor) LEVEL="minor" ;;
            bugfix) LEVEL="patch" ;;
            *) echo "::error::unknown release type '$BUMP'" >&2; exit 1 ;;
          esac
          RAW_VERSION="$(npm version "$LEVEL" --no-git-tag-version)"
          echo "NEW_TAG=v${RAW_VERSION#v}" >> "$GITHUB_ENV"

      - name: Build and verify the package before any remote write
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: bun run build:verify

      - name: Generate seankoji-com-ci App token
        if: github.event_name == 'workflow_dispatch'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SEANKOJI_CI_APP_ID }}
          private-key: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY }}
          owner: seankoji-com
          repositories: opencode-localise-timestamps

      # All local validation has passed. Push commit and tag atomically.
      - name: Push the prepared release
        if: github.event_name == 'workflow_dispatch'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "seankoji-com-ci[bot]"
          git config user.email "288827119+seankoji-com-ci[bot]@users.noreply.github.com"
          git commit -am "chore(release): $NEW_TAG"
          git tag "$NEW_TAG"
          REMOTE="https://x-access-token:${APP_TOKEN}@github.com/seankoji-com/opencode-localise-timestamps.git"
          git push --atomic "$REMOTE" HEAD:main "refs/tags/$NEW_TAG"

      - run: npm publish --access public --provenance

      # GitHub auto-drafts these from merged PR titles/labels since the
      # previous tag. `|| gh release edit` makes a re-run of this step
      # idempotent instead of failing on "release already exists".
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${NEW_TAG:-$REF_NAME}"
          gh release create "$TAG" --title "$TAG" --generate-notes \
            || gh release edit "$TAG" --title "$TAG" --generate-notes
