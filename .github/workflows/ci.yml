name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: test -f dist/index.js
      # Fails if package.json "files" would omit something dist needs, or
      # would ship something it shouldn't (source, tests, config).
      - run: npm pack --dry-run

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a tag rather than actionlint's own recommended `main` ref
      # for supply-chain reproducibility.
      # Maintained fork, not rhysd/actionlint: upstream is inactive and its
      # latest release rejects `concurrency.queue`, which the synced gatekeeper
      # caller uses (rhysd/actionlint#661 was closed unmerged). See
      # seankoji-com/.github#200.
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/kjanat/actionlint/v1.16.1/scripts/download-actionlint.bash) 1.16.1
      - run: ${{ steps.get_actionlint.outputs.executable }} -color
