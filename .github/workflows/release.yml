name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release type"
        required: true
        type: choice
        default: "bugfix"
        options:
          - breaking
          - minor
          - bugfix

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # Skip the redundant tag-push run when the tag was just pushed by the
    # dispatch path below (that push is attributed to seankoji-com-ci[bot]).
    if: github.event_name == 'workflow_dispatch' || github.actor != 'seankoji-com-ci[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: Generate seankoji-com-ci App token
        if: github.event_name == 'workflow_dispatch'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SEANKOJI_CI_APP_ID }}
          private-key: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY }}
          owner: seankoji-com
          repositories: opencode-localise-timestamps

      # Dispatch path: bump the version, push straight to main, tag, publish.
      # seankoji-com-ci is an "always" bypass_actor on both org rulesets (the
      # required-PR rule and the CodeQL-required rule this repo can never
      # satisfy, since it runs no CodeQL) -- pushing directly as that App
      # needs no branch/PR/merge dance. typecheck and test already ran above,
      # so this isn't skipping real verification, just an unsatisfiable
      # required check.
      - name: Bump version, push to main, tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run the dispatch against the main branch." >&2
            exit 1
          fi

          case "$BUMP" in
            breaking) LEVEL="major" ;;
            minor)    LEVEL="minor" ;;
            bugfix)   LEVEL="patch" ;;
            *) echo "::error::unknown release type '$BUMP'" >&2; exit 1 ;;
          esac

          git config user.name "seankoji-com-ci[bot]"
          git config user.email "288827119+seankoji-com-ci[bot]@users.noreply.github.com"

          RAW_VERSION="$(npm version "$LEVEL" --no-git-tag-version)" # e.g. "v0.2.0" or "0.2.0" depending on npm
          NEW_TAG="v${RAW_VERSION#v}"

          git commit -am "chore(release): $NEW_TAG"

          REMOTE="https://x-access-token:${APP_TOKEN}@github.com/seankoji-com/opencode-localise-timestamps.git"
          git push "$REMOTE" HEAD:main
          git tag "$NEW_TAG"
          git push "$REMOTE" "$NEW_TAG"

          # Read by the "Create GitHub release" step below — the tag-push
          # trigger has no equivalent since github.ref_name already names it.
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun build src/index.ts --outdir dist --target bun

      # Publishes via OIDC trusted publishing — no NPM_TOKEN secret. Requires
      # npm >= 11.5; Node 22 bundles npm 10.x, so upgrade first.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm publish --access public --provenance

      # GitHub auto-drafts these from merged PR titles/labels since the
      # previous tag. `|| gh release edit` makes a re-run of this step
      # idempotent instead of failing on "release already exists".
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${NEW_TAG:-$REF_NAME}"
          gh release create "$TAG" --title "$TAG" --generate-notes \
            || gh release edit "$TAG" --title "$TAG" --generate-notes
